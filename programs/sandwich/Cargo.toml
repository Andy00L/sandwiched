[package]
name = "sandwich"
version = "0.1.0"
description = "The Sandwich table program: seats, antes, the whale draw, pecks, swats and settlement on a MagicBlock Ephemeral Rollup."
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "sandwich"

[features]
default = ["faucet", "no-log-ix-name"]
faucet = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "anchor-spl/token_2022"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
anchor-spl = { version = "=1.0.2", default-features = false, features = ["token"] }
ephemeral-rollups-sdk = { version = "=0.18.0", features = ["anchor", "vrf"] }
session-keys = { version = "=3.1.1", features = ["no-entrypoint"] }
sandwich-rules = { path = "../../crates/sandwich-rules" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[lints.clippy]
diverging_sub_expression = "allow"
